services:
  postgres:
    image: postgres:16-alpine
    container_name: qr_ordering_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: qr_ordering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr_ordering_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/qr_ordering
      AUTH_SECRET: secret-auth-key-32-characters-minimum-required!
      DEVICE_COOKIE_SECRET: secret-cookie-key-32-chars-minimum-required!
      DEFAULT_TIMEZONE: Asia/Kolkata
      ENABLE_DEMO_SEED: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
